<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OAuth2 authorization code with PKCE</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 0.5rem;
    }

    .sub {
      font-size: 0.9rem;
      color: var(--color-muted);
      margin-bottom: 1.5rem;
      max-width: 40rem;
    }

    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Sequence · Diagram Design</p>
    <h1>OAuth2 authorization code with PKCE</h1>
    <p class="sub">GitHub and Google share one Auth Server role. Nonce is not one shared step: GitHub checks it before token; Google checks <span style="font-family: var(--font-mono); font-size: 0.85em;">id_token.nonce</span> after.</p>

    <svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="oauth2-auth-code-title oauth2-auth-code-desc">
      <title id="oauth2-auth-code-title">OAuth2 authorization code with PKCE</title>
      <desc id="oauth2-auth-code-desc">Browser starts login on Next.js, GitHub or Google as one auth server returns an authorization code, Next.js exchanges it with PKCE for tokens, then sets a session cookie and redirects to profile. GitHub checks nonce before the token call; Google checks it on the ID token after.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
        </marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/>
        </marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/>
        </marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- Lifelines: Browser 200 · Next.js 640 · Auth 1080 -->
      <line x1="200" y1="96" x2="200" y2="632" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="640" y1="96" x2="640" y2="632" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="1080" y1="96" x2="1080" y2="632" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>

      <!-- Activation bars -->
      <rect x="636" y="132" width="8" height="108" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
      <rect x="636" y="372" width="8" height="160" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
      <rect x="1076" y="276" width="8" height="64" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
      <rect x="1076" y="420" width="8" height="64" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>

      <!-- M1 Browser → Next.js -->
      <line x1="200" y1="136" x2="636" y2="136" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <!-- M2 Next.js self mint -->
      <path d="M 644 184 L 680 184 L 680 208 L 644 208" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- M3 Next.js → Browser return -->
      <line x1="636" y1="232" x2="204" y2="232" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <!-- M4 Browser → Auth -->
      <line x1="200" y1="280" x2="1076" y2="280" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <!-- M5 Auth → Browser return -->
      <line x1="1076" y1="328" x2="204" y2="328" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <!-- M6 Browser → Next.js callback -->
      <line x1="200" y1="376" x2="636" y2="376" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <!-- M7 Next.js → Auth token -->
      <line x1="644" y1="424" x2="1076" y2="424" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <!-- M8 Auth → Next.js tokens (headline) -->
      <line x1="1076" y1="472" x2="648" y2="472" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <!-- M9 Next.js → Browser session -->
      <line x1="636" y1="520" x2="204" y2="520" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>

      <!-- Labels -->
      <rect x="362" y="116" width="112" height="12" rx="2" fill="#f5f5f5"/>
      <text x="418" y="124" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">GET /LOGIN/{P}</text>

      <rect x="692" y="188" width="112" height="12" rx="2" fill="#f5f5f5"/>
      <text x="748" y="196" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">MINT STATE PKCE</text>

      <rect x="366" y="212" width="104" height="12" rx="2" fill="#f5f5f5"/>
      <text x="418" y="220" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">302 + COOKIES</text>

      <rect x="364" y="260" width="112" height="12" rx="2" fill="#f5f5f5"/>
      <text x="420" y="268" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">GET AUTHORIZE</text>

      <rect x="816" y="308" width="88" height="12" rx="2" fill="#f5f5f5"/>
      <text x="860" y="316" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">302 + CODE</text>

      <rect x="366" y="356" width="104" height="12" rx="2" fill="#f5f5f5"/>
      <text x="418" y="364" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">GET /CALLBACK</text>

      <rect x="804" y="404" width="112" height="12" rx="2" fill="#f5f5f5"/>
      <text x="860" y="412" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">POST TOKEN+PKCE</text>

      <rect x="812" y="452" width="96" height="12" rx="2" fill="#f5f5f5"/>
      <text x="860" y="460" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">ACCESS TOKEN</text>

      <rect x="370" y="500" width="96" height="12" rx="2" fill="#f5f5f5"/>
      <text x="418" y="508" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">302 + SESSION</text>

      <!-- Actor: Browser -->
      <rect x="120" y="40" width="160" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="120" y="40" width="160" height="56" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <rect x="128" y="48" width="36" height="12" rx="2" fill="transparent" stroke="rgba(122,131,153,0.40)" stroke-width="0.8"/>
      <text x="146" y="56" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">USER</text>
      <text x="200" y="72" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Browser</text>
      <text x="200" y="84" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">user agent</text>

      <!-- Actor: Next.js (focal) -->
      <rect x="560" y="40" width="160" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="560" y="40" width="160" height="56" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <rect x="568" y="48" width="32" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.50)" stroke-width="0.8"/>
      <text x="584" y="56" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">APP</text>
      <text x="640" y="72" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Next.js</text>
      <text x="640" y="84" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">Pages · GSSP</text>

      <!-- Actor: Auth Server -->
      <rect x="1000" y="40" width="160" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="1000" y="40" width="160" height="56" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <rect x="1008" y="48" width="36" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.30)" stroke-width="0.8"/>
      <text x="1026" y="56" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">AUTH</text>
      <text x="1080" y="72" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Auth Server</text>
      <text x="1080" y="84" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">GitHub / Google</text>

      <!-- Legend -->
      <line x1="40" y1="656" x2="1240" y2="656" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="40" y="672" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>

      <rect x="40" y="684" width="14" height="10" rx="2" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <text x="60" y="692" fill="#4f5d75" font-size="8" font-family="'Geist', sans-serif">User</text>

      <rect x="140" y="684" width="14" height="10" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="160" y="692" fill="#4f5d75" font-size="8" font-family="'Geist', sans-serif">Focal</text>

      <rect x="240" y="684" width="14" height="10" rx="2" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="260" y="692" fill="#4f5d75" font-size="8" font-family="'Geist', sans-serif">External</text>

      <line x1="360" y1="688" x2="392" y2="688" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <text x="400" y="692" fill="#4f5d75" font-size="8" font-family="'Geist', sans-serif">HTTP call</text>

      <line x1="500" y1="688" x2="532" y2="688" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <text x="540" y="692" fill="#4f5d75" font-size="8" font-family="'Geist', sans-serif">Return</text>

      <line x1="632" y1="688" x2="664" y2="688" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <text x="672" y="692" fill="#4f5d75" font-size="8" font-family="'Geist', sans-serif">Headline</text>
    </svg>
  </div>
</body>
</html>
